<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmacia San Benito - POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-slate-100 min-h-screen font-sans">

    <!-- BARRA SUPERIOR -->
    <header class="bg-teal-700 text-white shadow-lg p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-prescription-bottle-medical text-3xl text-teal-200"></i>
                <h1 class="text-2xl font-bold tracking-wide">Farmacia San Benito <span
                        class="text-sm font-normal bg-teal-800 px-2 py-1 rounded-md ml-2">Punto de Venta</span></h1>
            </div>
            <div class="flex items-center space-x-2 text-sm bg-teal-800 px-3 py-1 rounded-full text-teal-200">
                <span class="w-2.5 h-2.5 bg-green-400 rounded-full animate-pulse"></span>
                <span>Usuario: Holman Romero | XAMPP Conectado</span>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-12 gap-6">

        <!-- SECCIÓN IZQUIERDA: FORMULARIO DE VENTA -->
        <section class="md:col-span-7 bg-white p-6 rounded-xl shadow-md border border-slate-200">
            <h2 class="text-xl font-bold text-slate-800 border-b pb-3 mb-4 flex items-center">
                <i class="fa-solid fa-cart-shopping text-teal-600 mr-2"></i> Búsqueda de Medicamentos
            </h2>

            <div class="mb-5">
                <label class="block text-sm font-semibold text-slate-700 mb-1">Código de Barras:</label>
                <div class="flex space-x-2">
                    <input type="text" id="codigoBarras" placeholder="Ej: 750101 o 750102"
                        class="flex-1 border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500 font-mono text-lg">
                    <button onclick="buscarProducto()"
                        class="bg-teal-600 hover:bg-teal-700 text-white font-semibold px-5 py-2 rounded-lg transition duration-200 flex items-center">
                        <i class="fa-solid fa-magnifying-glass mr-2"></i> Buscar
                    </button>
                </div>
            </div>

            <!-- TARJETA DEL PRODUCTO -->
            <div id="cardProducto" class="hidden bg-slate-50 border border-slate-200 p-4 rounded-lg mb-5">
                <div class="flex justify-between items-start">
                    <div>
                        <h3 id="lblNombre" class="text-lg font-bold text-slate-800">---</h3>
                        <p id="lblDetalles" class="text-xs text-slate-500 mt-0.5 font-mono">---</p>
                    </div>
                    <span id="lblPrecio" class="text-2xl font-extrabold text-teal-700">$0.00</span>
                </div>

                <!-- ALERTA DE RECETA -->
                <div id="alertaReceta"
                    class="hidden mt-3 p-3 bg-amber-50 border border-amber-300 text-amber-800 text-sm rounded-md flex items-center">
                    <i class="fa-solid fa-file-medical text-amber-600 text-xl mr-3"></i>
                    <div><strong>Medicamento Controlado:</strong> Requiere número de colegiado del médico.</div>
                </div>
            </div>

            <!-- SECCIÓN DE VENTA -->
            <div id="seccionVenta" class="space-y-4 opacity-50 pointer-events-none transition duration-300">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Cantidad:</label>
                        <input type="number" id="txtCantidad" value="1" min="1"
                            class="w-full border border-slate-300 rounded-lg px-3 py-2 font-bold text-slate-800 focus:ring-2 focus:ring-teal-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">N° Colegiado Médico:</label>
                        <input type="text" id="txtColegiado" placeholder="Obligatorio para receta" disabled
                            class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-slate-100 focus:ring-2 focus:ring-teal-500 font-mono">
                    </div>
                </div>

                <button onclick="procesarVenta()"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg text-lg shadow-md transition duration-200 flex justify-center items-center">
                    <i class="fa-solid fa-cash-register mr-2"></i> COMPLETAR VENTA (APLICAR FEFO)
                </button>
            </div>
        </section>

        <!-- SECCIÓN DERECHA: TICKET -->
        <section
            class="md:col-span-5 bg-white p-6 rounded-xl shadow-md border border-slate-200 flex flex-col justify-between">
            <div>
                <h2 class="text-xl font-bold text-slate-800 border-b pb-3 mb-4 flex items-center">
                    <i class="fa-solid fa-receipt text-teal-600 mr-2"></i> Ticket de Venta
                </h2>

                <div id="ticketContenido"
                    class="bg-amber-50/50 border border-amber-200/60 p-5 rounded-lg font-mono text-sm text-slate-700 min-h-[250px] flex flex-col justify-center items-center text-center shadow-inner">
                    <i class="fa-solid fa-store text-4xl text-slate-300 mb-2"></i>
                    <p class="text-slate-400">Escanee un producto para iniciar.</p>
                </div>
            </div>
            <div id="notificacion" class="hidden p-3 rounded-lg mt-4 text-sm font-semibold text-center"></div>
        </section>
    </main>

    <!-- LÓGICA DE CONEXIÓN CON TU PYTHON -->
    <script>
        const API_URL = "http://localhost:8000/api";
        let productoActual = null;

        async function buscarProducto() {
            const codigo = document.getElementById('codigoBarras').value.trim();
            if (!codigo) { mostrarNotificacion("Ingrese un código de barras.", "error"); return; }

            try {
                const res = await fetch(`${API_URL}/medicamentos/buscar/${codigo}`);
                if (!res.ok) throw new Error("Medicamento no encontrado en XAMPP");

                productoActual = await res.json();

                document.getElementById('cardProducto').classList.remove('hidden');
                document.getElementById('lblNombre').textContent = productoActual.nombre;
                document.getElementById('lblDetalles').textContent = `Stock Total: ${productoActual.stock} uds | Lote Próximo: ${productoActual.lote} (Vence: ${productoActual.fecha_vencimiento})`;
                document.getElementById('lblPrecio').textContent = `$${productoActual.precio.toFixed(2)}`;

                const secVenta = document.getElementById('seccionVenta');
                secVenta.classList.remove('opacity-50', 'pointer-events-none');

                const alerta = document.getElementById('alertaReceta');
                const txtColegiado = document.getElementById('txtColegiado');

                if (productoActual.requiere_receta) {
                    alerta.classList.remove('hidden');
                    txtColegiado.disabled = false;
                    txtColegiado.classList.remove('bg-slate-100');
                    txtColegiado.focus();
                } else {
                    alerta.classList.add('hidden');
                    txtColegiado.disabled = true;
                    txtColegiado.value = "";
                    txtColegiado.classList.add('bg-slate-100');
                }
                ocultarNotificacion();
            } catch (err) {
                document.getElementById('cardProducto').classList.add('hidden');
                document.getElementById('seccionVenta').classList.add('opacity-50', 'pointer-events-none');
                mostrarNotificacion(err.message, "error");
            }
        }

        async function procesarVenta() {
            if (!productoActual) return;
            const cantidad = parseInt(document.getElementById('txtCantidad').value);
            const colegiado = document.getElementById('txtColegiado').value.trim();

            try {
                const res = await fetch(`${API_URL}/ventas/procesar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_medicamento: productoActual.id, cantidad: cantidad, num_colegiado_medico: colegiado || null })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Error al procesar la venta");

                document.getElementById('ticketContenido').innerHTML = `
                    <div class="w-full text-left space-y-2">
                        <div class="text-center border-b border-dashed border-slate-300 pb-2 mb-2">
                            <h4 class="font-bold text-base text-slate-800">FARMACIA SAN BENITO</h4>
                            <p class="text-xs text-slate-500">Ticket de Venta (FEFO Aplicado)</p>
                        </div>
                        <p><strong>Producto:</strong> ${data.producto}</p>
                        <p><strong>Cantidad:</strong> ${data.cantidad}</p>
                        <p><strong>Precio Unit:</strong> $${data.precio_unitario.toFixed(2)}</p>
                        ${data.colegiado_medico !== 'N/A' ? `<p class="text-amber-700"><strong>Colegiado:</strong> ${data.colegiado_medico}</p>` : ''}
                        <div class="border-t border-dashed border-slate-300 pt-2 mt-2 flex justify-between text-base font-bold text-slate-900">
                            <span>TOTAL:</span>
                            <span>$${data.total_pagado.toFixed(2)}</span>
                        </div>
                        <p class="text-xs text-slate-400 text-center mt-3">Stock restante: ${data.stock_restante} uds.</p>
                    </div>
                `;
                mostrarNotificacion("¡Venta exitosa registrada en XAMPP!", "exito");
                buscarProducto(); // Actualiza el stock en pantalla
            } catch (err) {
                mostrarNotificacion(err.message, "error");
            }
        }

        function mostrarNotificacion(msg, tipo) {
            const noti = document.getElementById('notificacion');
            noti.className = `p-3 rounded-lg mt-4 text-sm font-semibold text-center ${tipo === 'error' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            noti.textContent = msg;
        }
        function ocultarNotificacion() { document.getElementById('notificacion').classList.add('hidden'); }
    </script>
</body>

</html>
